<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nrf-policy-db DB 관리</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1a1f27; --muted: #6b7280;
    --border: #dfe3e8; --accent: #2456c9; --accent-weak: #e8eefb;
    --ok-bg: #e7f6ec; --ok-border: #93d3a8; --ok-text: #176d33;
    --warn-bg: #fef7e0; --warn-border: #f0c96b; --warn-text: #7c5e10;
    --err-bg: #fdecec; --err-border: #e8a0a0; --err-text: #a02020;
    --info-bg: #eef1f5; --info-border: #c9d0da; --info-text: #4a5261;
    --log-err: #c22f2f; --log-warn: #9a6d10;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1d2129; --text: #e6e9ee; --muted: #9aa2af;
      --border: #333a45; --accent: #6f9bf0; --accent-weak: #24314d;
      --ok-bg: #1c3a26; --ok-border: #3f7c53; --ok-text: #9fdcb2;
      --warn-bg: #3c3417; --warn-border: #8a742f; --warn-text: #e8d48a;
      --err-bg: #421f1f; --err-border: #8a4444; --err-text: #f0a8a8;
      --info-bg: #232833; --info-border: #3b4350; --info-text: #aab3c2;
      --log-err: #f08c8c; --log-warn: #e2c06d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .head .navs { display: flex; gap: 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  a.nav {
    color: var(--accent); text-decoration: none; font-size: 13.5px; font-weight: 600;
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px;
    background: var(--panel); white-space: nowrap;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
  }
  h2 { font-size: 14px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 9px 22px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.mini { padding: 3px 12px; font-size: 12.5px; font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  button.danger { background: transparent; color: var(--err-text); border: 1px solid var(--err-border); }
  .box { border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; border: 1px solid; }
  .box.ok { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok-text); }
  .box.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
  .box.err { background: var(--err-bg); border-color: var(--err-border); color: var(--err-text); }
  .box.info { background: var(--info-bg); border-color: var(--info-border); color: var(--info-text); }
  .box .hint { font-size: 13px; margin-top: 6px; opacity: .9; }
  .box .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .box .files {
    font-family: Consolas, "D2Coding", monospace; font-size: 12px; margin-top: 4px; opacity: .85;
    word-break: break-all;
  }
  .box .ctl { margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; }
  .box .ctl label { cursor: pointer; white-space: nowrap; }
  .box .rid-input {
    font: inherit; font-size: 13.5px; padding: 5px 10px; min-width: 300px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text);
  }
  .box .mono-block {
    font-family: Consolas, "D2Coding", monospace; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; margin-top: 6px; max-height: 220px; overflow-y: auto;
  }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .note { color: var(--muted); font-size: 12.5px; }
  #job-stages { font-size: 13px; margin-bottom: 6px; }
  #job-stages .st { padding: 2px 0; }
  #job-stages .st .mark { display: inline-block; min-width: 70px; font-weight: 700; }
  #job-stages .st.ok .mark { color: var(--ok-text); }
  #job-stages .st.fail .mark { color: var(--err-text); }
  #job-stages .st.run .mark { color: var(--accent); }
  #job-stages .st.idle { color: var(--muted); }
  #job-stages .st .drop { color: var(--warn-text); font-size: 12px; margin-left: 6px; }
  #pipe-log {
    font-family: Consolas, "D2Coding", monospace; font-size: 12px; line-height: 1.5;
    max-height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; margin-top: 6px;
  }
  #pipe-log .err { color: var(--log-err); }
  #pipe-log .warn { color: var(--log-warn); }
  #pipe-log .sep { font-weight: 700; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>DB 관리</h1>
      <div class="sub">파일별 문제 카드 확인 → 결정 선택 → 일괄 해결</div>
    </div>
    <div class="navs">
      <a class="nav" href="/browse">자료 현황</a>
      <a class="nav" href="/">← 검색으로</a>
    </div>
  </div>

  <div class="panel hidden" id="job-panel">
    <h2>작업 로그</h2>
    <div id="job-stages"></div>
    <div id="pipe-log"></div>
    <div class="row">
      <button id="cancel" class="danger hidden">작업 중지</button>
      <span id="pipe-status" class="note">대기 중</span>
    </div>
    <div id="pipe-outcome" style="margin-top:10px"></div>
  </div>

  <div id="banners"></div>

  <div class="panel">
    <h2>필요한 조치 <button id="refresh" class="mini ghost" style="margin-left:8px">새로고침</button></h2>
    <div id="cards" class="note">불러오는 중…</div>
    <div class="row">
      <button id="resolve">일괄 해결</button>
      <span id="plan-preview" class="note"></span>
    </div>
    <div class="note" style="margin-top:8px">일괄 해결은 카드의 결정대로 필요한 파일만
      파이프라인(추출 → 추출 검증 → 요약 생성 → 요약 품질 검증 → DB 동기화 → 카탈로그 재생성)에
      태워 순서대로 처리합니다. 중간에 문제가 생긴 파일은 빼고 나머지는 끝까지 진행한 뒤,
      남은 문제를 다시 카드로 띄웁니다.</div>
  </div>

  <div class="panel">
    <span id="summary" class="note"></span>
    <a class="nav" href="/browse" style="margin-left:10px">자료 현황 보기 →</a>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

const ERR_RE = /FAIL|\[error\]|Traceback|오류|실패/;
const WARN_RE = /경고|\[skip|WARN|스킵|미반영|주의|게이트/;

let lastStatus = null;
let jobId = null, cursor = 0, pollTimer = null, busy = false;
let previewSeq = 0;

// ---- 공용 DOM 헬퍼 ----
function box(cls, kids) {
  const d = document.createElement("div");
  d.className = "box " + cls;
  d.append(...kids);
  return d;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function txt(s) { return document.createTextNode(s); }
function bold(s) { const b = document.createElement("b"); b.textContent = s; return b; }

// ---- 현황 + 카드 ----
async function refreshStatus() {
  $("cards").textContent = "불러오는 중…";
  let s;
  try {
    s = await (await fetch("/api/admin/status")).json();
  } catch (e) {
    $("cards").textContent = "현황 조회 실패: " + e.message;
    return;
  }
  lastStatus = s;
  const bn = $("banners");
  bn.textContent = "";
  if (!s.freshness.ok) {
    bn.appendChild(box("warn", [
      bold("⚠ 검색 차단 중"),
      txt(` — ${s.freshness.message} 아래 조치를 해결하면 차단이 풀립니다.`),
    ]));
  }
  renderCards(s.cards);
  renderSummary(s);
  updatePreview();
}

function renderSummary(s) {
  let done = 0, total = 0;
  for (const r of s.rows) {
    const m = /^(\d+)\/(\d+)$/.exec(r.summary);
    if (m) { done += +m[1]; total += +m[2]; }
  }
  $("summary").textContent =
    `보고서 ${s.rows.length}권 · 유닛 요약 ${done}/${total} · 잔여 호출 ${s.remaining_total}건`;
}

function ctlWrap(type, pdf) {
  const d = el("div", "ctl");
  d.dataset.type = type;
  d.dataset.pdf = pdf;
  return d;
}
function radio(group, value, label, checked) {
  const l = el("label");
  const r = document.createElement("input");
  r.type = "radio";
  r.name = group;
  r.value = value;
  r.checked = checked;
  r.className = "card-ctl";
  r.addEventListener("change", updatePreview);
  l.append(r, txt(" " + label));
  return l;
}
function checkbox(label, checked) {
  const l = el("label");
  const c = document.createElement("input");
  c.type = "checkbox";
  c.checked = checked;
  c.className = "card-ctl";
  c.dataset.role = "include";
  c.addEventListener("change", updatePreview);
  l.append(c, txt(" " + label));
  return l;
}

// 관리번호 기입 필요 카드의 입력칸 — 표(report_ids.tsv)를 손으로 고치지 않게 서버가 대신 기록.
// 저장 성공 시 현황을 다시 읽어 카드가 '추출 대기'로 바뀐다(값 검증은 서버 register.set_rid).
function registerInput(file) {
  const w = el("div", "actions");
  const inp = document.createElement("input");
  inp.type = "text";
  inp.placeholder = "예: 2022-04 · 같은 번호의 다른 문서면 2022-04-b · 번호 모르면 2021-00(자동 -vN) · 연도도 모르면 0000-00";
  inp.className = "rid-input";
  inp.setAttribute("aria-label", "관리번호");
  const save = document.createElement("button");
  save.className = "mini";
  save.textContent = "저장";
  const msg = el("span", "note");
  async function submit() {
    const rid = inp.value.trim();
    if (!rid) { msg.textContent = "번호를 입력하세요."; return; }
    save.disabled = true; inp.disabled = true;
    msg.textContent = "저장 중…";
    let res, j;
    try {
      res = await fetch("/api/admin/register_set", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ file, rid }),
      });
      j = await res.json();
    } catch (e) {
      msg.textContent = "서버 연결 실패: " + e.message;
      save.disabled = false; inp.disabled = false;
      return;
    }
    if (!res.ok) {
      msg.textContent = "✗ " + (j.error || `HTTP ${res.status}`);
      save.disabled = false; inp.disabled = false;
      return;
    }
    msg.textContent = "✓ 기록됨" + (j.warning ? " — " + j.warning : "");
    await refreshStatus();
  }
  save.addEventListener("click", submit);
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  w.append(inp, save, msg);
  return w;
}

let ctlSeq = 0;
function renderCards(cards) {
  const host = $("cards");
  host.textContent = "";
  if (!cards.length) {
    host.appendChild(box("ok", [txt("✓ 조치가 필요한 항목이 없습니다 — 모든 아티팩트 동기화 상태입니다.")]));
    return;
  }
  for (const c of cards) {
    const kids = [bold(c.title), el("div", "hint", c.detail)];
    if (c.files && c.files.length) {
      const shown = c.files.length > 6 ? c.files.slice(0, 6).join(", ") + ` 외 ${c.files.length - 6}건`
                                       : c.files.join(", ");
      kids.push(el("div", "files", shown));
    }
    const b = box(c.severity, kids);
    const ex = c.extra || {};
    if (c.kind === "detect_fail") {
      const att = ex.l1_attempts && Object.keys(ex.l1_attempts).length
        ? Object.entries(ex.l1_attempts).map(([k, v]) => `${k} ${v}`).join(" · ")
        : "없음(장 번호 후보 신호 자체가 없음)";
      b.appendChild(el("div", "hint", "후보 프로파일별 정상 장 수: " + att));
      const sus = ex.l1_suspects || [];
      if (sus.length) {
        b.appendChild(el("div", "hint", `헤딩으로 의심되는 줄 ${sus.length}개 — 이 문서의 장 문법 후보:`));
        b.appendChild(el("div", "mono-block", sus.join("\n")));
      } else {
        b.appendChild(el("div", "hint", "헤딩 의심 줄 없음 — 번호 문법이 아예 없는 문서일 가능성이 높습니다(플랫 수용 권장)."));
      }
    }
    if (c.kind === "register_manual") b.appendChild(registerInput(c.files[0]));
    if (ex.error) b.appendChild(el("div", "mono-block", ex.error));
    if (ex.errors && ex.errors.length) b.appendChild(el("div", "mono-block", ex.errors.join("\n")));
    if (ex.items && ex.items.length) {
      const list = el("div", "hint");
      for (const it of ex.items) list.appendChild(el("div", "", "· " + it));
      b.appendChild(list);
    }
    if (c.control) {
      const con = c.control;
      const group = "ctl-" + (ctlSeq++);
      const w = ctlWrap(con.type, con.pdf);
      if (con.type === "lane" || con.type === "lane_opt") {
        if (con.type === "lane_opt") w.appendChild(checkbox("이번 해결에 포함", true));
        w.append(radio(group, "structured", "structured (정책보고서류)", con.default === "structured"),
                 radio(group, "flat", "flat (플랫 청킹)", con.default === "flat"));
      } else if (con.type === "detect") {
        w.append(radio(group, "promote", "승격 실행 (에이전트)", false),
                 radio(group, "flat", "플랫으로 수용", false),
                 radio(group, "skip", "보류", true));
      } else if (con.type === "force") {
        w.appendChild(checkbox("--force 재추출 포함 (요약·검증 스탬프 소실)", false));
        w.dataset.lane = con.lane;
      }
      b.appendChild(w);
    }
    host.appendChild(b);
  }
}

function collectDecisions() {
  const pdfs = {}, force = [];
  for (const w of document.querySelectorAll("#cards .ctl")) {
    const type = w.dataset.type, pdf = w.dataset.pdf;
    const include = w.querySelector('input[data-role="include"]');
    const picked = w.querySelector('input[type="radio"]:checked');
    if (type === "force") {
      if (include && include.checked) force.push(pdf);
    } else if (include && !include.checked) {
      pdfs[pdf] = "skip";
    } else if (picked) {
      pdfs[pdf] = picked.value;
    }
  }
  return { pdfs, force };
}

async function updatePreview() {
  const seq = ++previewSeq;
  const pv = $("plan-preview");
  let res, j;
  try {
    res = await fetch("/api/admin/resolve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decisions: collectDecisions(), dry_run: true }),
    });
    j = await res.json();
  } catch (e) {
    if (seq === previewSeq) pv.textContent = "계획 미리보기 실패: " + e.message;
    return;
  }
  if (seq !== previewSeq) return; // 더 최신 미리보기가 이미 나감
  if (!res.ok) {
    pv.textContent = j.error || `HTTP ${res.status}`;
    $("resolve").disabled = true;
    return;
  }
  if (!j.stages.length) {
    pv.textContent = "실행할 단계가 없습니다 — 이미 최신 상태입니다.";
    $("resolve").disabled = true;
    return;
  }
  pv.textContent = "실행 계획: " + j.stages.map((s) =>
    ["verify", "annotate", "verify2"].includes(s.step) ? `${s.label} ${s.files.length}건` : s.label
  ).join(" → ");
  $("resolve").disabled = busy;
}

// ---- 일괄 해결 실행 ----
async function resolveAll() {
  if (busy) return;
  const decisions = collectDecisions();
  if (decisions.force.length &&
      !confirm(`--force 재추출 ${decisions.force.length}건이 포함되어 있습니다.\n` +
               "기존 요약·검증 스탬프를 버리고 재추출부터 검증·요약 재생성(LLM 사용량 소모)·" +
               "DB 반영까지 다시 돌립니다. 계속할까요?")) return;
  let res, j;
  try {
    res = await fetch("/api/admin/resolve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decisions, dry_run: false }),
    });
    j = await res.json();
  } catch (e) {
    $("pipe-outcome").textContent = "";
    $("pipe-outcome").appendChild(box("err", [txt("서버 연결 실패: " + e.message)]));
    showJobPanel();
    return;
  }
  if (!res.ok) {
    $("pipe-outcome").textContent = "";
    $("pipe-outcome").appendChild(box("err", [txt(j.error || `HTTP ${res.status}`)]));
    showJobPanel();
    return;
  }
  jobId = j.id;
  cursor = 0;
  clearRun();
  showJobPanel();
  setBusy(true);
  clearTimeout(pollTimer);
  pollJob();
}

function showJobPanel() { $("job-panel").classList.remove("hidden"); }

function setBusy(b) {
  busy = b;
  $("resolve").disabled = b;
  $("refresh").disabled = b;
  for (const i of document.querySelectorAll("#cards input")) i.disabled = b;
  $("cancel").classList.toggle("hidden", !b);
  $("pipe-status").textContent = b ? "실행 중…" : "대기 중";
}

function clearRun() {
  $("pipe-log").textContent = "";
  $("job-stages").textContent = "";
  $("pipe-outcome").textContent = "";
}

function addLogLines(lines) {
  const log = $("pipe-log");
  for (const line of lines) {
    const d = document.createElement("div");
    if (line.startsWith("[serve] ── ")) d.className = "sep";
    else if (ERR_RE.test(line)) d.className = "err";
    else if (WARN_RE.test(line)) d.className = "warn";
    d.textContent = line || " ";
    log.appendChild(d);
  }
  log.scrollTop = log.scrollHeight;
}

function renderStages(j) {
  const host = $("job-stages");
  host.textContent = "";
  j.stages.forEach((s, i) => {
    let cls = "idle", mark = "· 대기";
    if (s.code === 0) { cls = "ok"; mark = "✓ 통과"; }
    else if (s.code !== null) { cls = "fail"; mark = `✗ exit ${s.code}`; }
    else if (s.skipped) { cls = "idle"; mark = "— 생략"; }
    else if (j.running && i === j.current) { cls = "run"; mark = "▶ 실행 중"; }
    const d = el("div", "st " + cls);
    d.appendChild(el("span", "mark", mark));
    d.appendChild(txt(` ${i + 1}. ${s.label}`));
    if (s.dropped && s.dropped.length) {
      d.appendChild(el("span", "drop", `탈락: ${s.dropped.join(", ")}`));
    }
    host.appendChild(d);
  });
}

async function ackJob() {
  try { await fetch("/api/admin/job/ack", { method: "POST" }); } catch (e) {}
  clearRun();
  $("job-panel").classList.add("hidden");
}

function ackButton(label) {
  const b = document.createElement("button");
  b.className = "mini ghost";
  b.textContent = label;
  b.addEventListener("click", ackJob);
  return b;
}

function showOutcome(j) {
  const out = $("pipe-outcome");
  out.textContent = "";
  const failed = j.stages.filter((s) => s.code !== null && s.code !== 0);
  const dropped = j.stages.flatMap((s) => s.dropped || []);
  const hadPromote = j.stages.some((s) => s.step === "promote");
  let b;
  if (j.code === 0) {
    b = box("ok", [txt("✓ 일괄 해결 완료 — 전 단계 통과, 탈락 없음.")]);
  } else if (j.code === 2) {
    b = box("err", [
      bold("✗ 공통 장애로 중단"),
      txt(" — 사용 오류·인증·사용량 한도 문제입니다. 위 로그의 강조 줄을 확인해 해결한 뒤 다시 일괄 해결을 실행하세요(남은 작업부터 이어집니다)."),
    ]);
  } else {
    const kids = [bold("일괄 해결 종료 — 남은 문제가 있습니다.")];
    const list = el("div", "hint");
    for (const s of failed) list.appendChild(el("div", "", `· ${s.label}: 종료 코드 ${s.code}`));
    const uniqDropped = [...new Set(dropped)];
    if (uniqDropped.length) list.appendChild(el("div", "", `· 중도 탈락 ${uniqDropped.length}건: ${uniqDropped.join(", ")}`));
    kids.push(list);
    kids.push(el("div", "hint",
      "가능한 파일은 끝까지 처리했습니다. 위 로그의 강조 줄과 아래 카드를 확인하고, 결정을 조정해 다시 일괄 해결을 실행하면 남은 작업부터 이어집니다."));
    b = box("warn", kids);
  }
  if (hadPromote) {
    b.appendChild(el("div", "hint",
      j.stages.some((s) => s.step === "promote" && s.code === 0)
        ? "프로파일 승격 성공분: extract.py 변경분은 미커밋 상태입니다 — 검토 후 커밋은 직접 해주세요."
        : "승격 실패·부적합이면 이 문서는 플랫 수용을 권장합니다. extract.py 원상 복구 여부는 로그의 [promote] 보고로 확인하세요."));
  }
  const actions = el("div", "actions");
  actions.appendChild(ackButton("확인(닫기)"));
  b.appendChild(actions);
  out.appendChild(b);
}

async function pollJob() {
  let j;
  try {
    j = await (await fetch(`/api/admin/job?after=${cursor}`)).json();
  } catch (e) {
    pollTimer = setTimeout(pollJob, 2000); // 일시 단절 — 재시도
    return;
  }
  if (!j.exists) { setBusy(false); return; }
  if (j.id !== jobId) { jobId = j.id; cursor = 0; clearRun(); }
  if (j.lines.length) addLogLines(j.lines);
  cursor = j.total;
  renderStages(j);
  if (j.running) {
    showJobPanel();
    if (!busy) setBusy(true);
    pollTimer = setTimeout(pollJob, 1000);
  } else {
    setBusy(false);
    await refreshStatus(); // 잔여 문제를 카드로 재도출한 뒤 결과 안내
    showOutcome(j);
  }
}

async function attachJob() {
  let j;
  try {
    j = await (await fetch("/api/admin/job?after=0")).json();
  } catch (e) { return; }
  if (!j.exists) return;
  if (!j.running && j.acked) return; // [확인]으로 닫은 완료 기록 — 재생하지 않음
  jobId = j.id;
  cursor = j.total;
  clearRun();
  showJobPanel();
  addLogLines(j.lines);
  renderStages(j);
  if (j.running) {
    setBusy(true);
    pollTimer = setTimeout(pollJob, 1000);
  } else {
    showOutcome(j);
  }
}

// ---- 초기화 ----
$("refresh").addEventListener("click", refreshStatus);
$("resolve").addEventListener("click", resolveAll);
$("cancel").addEventListener("click", async () => {
  await fetch("/api/admin/cancel", { method: "POST" });
});
(async () => {
  await refreshStatus(); // attachJob의 결과 안내가 최신 카드를 전제하므로 선행
  attachJob();
})();
</script>
